# 文件站設定。真本在私有 repo 的 docs-site/，由 npm run docs:sync 複製進鏡像 repo。
# 直接在鏡像 repo 上改這一份，下次同步就會被覆蓋。

site_name: 血液透析中心平板照護輔助系統
site_description: 需求、進度、參考與測試文件
site_url: https://94sh09sh19sh.github.io/hd-docs/

docs_dir: docs
use_directory_urls: true

theme:
  name: material
  # 「問 AI」浮動按鈕在 overrides/main.html
  custom_dir: overrides
  language: zh-TW
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切換為深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切換為淺色

# 版本下拉選單：latest 是現行版，每週定版各出一個凍結版（mike 產生）
extra:
  version:
    provider: mike
    default: latest
  # 閱讀統計的收集端網址（Google Apps Script 部署後的 …/exec）。空白就不追蹤。
  # 追蹤碼在 overrides/main.html，收集端與統計頁的產生見 docs/weekly/HOWTO.md「一次性設定」第 4 項。
  # 這個網址只收資料、讀資料要另一把金鑰（只在 .env），寫在公開設定裡沒有關係。
  readership:
    endpoint: 'https://script.google.com/macros/s/AKfycbyzGjnw5e6NJDYWfjaF3YmjcVnozsfTXO7FoJoyHt3BEQqyeZG20z2oNFQ9yxWGEdPUww/exec'

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  # slugify 一定要指定：MkDocs 預設的錨點會把中文整段去掉，
  # 「## Q-10 · 常駐總覽螢幕的位置與硬體」會塌成 #q-10-，文件裡既有的內部連結會全部指不到。
  # 這一組產生的錨點與 GitHub 一致（小寫、空白換成連字號、中文保留）。
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - zh
        - en
  # 產生 llms.txt（全站目錄）與每頁旁邊的 index.md，給「問 AI」按鈕帶去的 AI 讀。
  # 用萬用字元列檔，新增文件不必回來改這裡；全文合併檔不產生（整站約 1.8 MB，AI 一次讀不完）。
  # base_url 要帶版本路徑：現行版用預設值，凍結版由 workflow 以環境變數改成該週網址。
  - llmstxt:
      base_url: !ENV [LLMSTXT_BASE_URL, 'https://94sh09sh19sh.github.io/hd-docs/latest/']
      markdown_description: >-
        透析中心平板照護輔助系統的公開文件。回答時請用台灣繁體中文，只根據這些文件，並附上出處網址。
        各頁連結都是 Markdown 版，可直接讀取。
      sections:
        進度與週報:
          - index.md
          - weekly/2*.md
          - weekly/archive.md
          - reports/*.md
        需求文件:
          - requirements/*.md
        參考:
          - reference/*.md
        其他文件:
          - notes/*.md
        手動測試:
          - testing/*.md
        部署手冊:
          - deployment/*.md
        維護流程:
          - weekly/HOWTO.md
          - weekly/doc-architecture.md
          - weekly/AGENT.md

# llms.txt 每頁底下補上二級標題（外掛本身只列頁名）
hooks:
  - hooks/llms_headings.py

