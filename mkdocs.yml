# 由 scripts/snapshot-import.mjs 產生，不要手改。
# 0909 定版的站台設定：nav 只收這一版真的存在的頁面。

site_name: 血液透析中心平板照護輔助系統
site_description: 0909 定版
site_url: https://94sh09sh19sh.github.io/hd-docs/0909/

docs_dir: docs
use_directory_urls: true

theme:
  name: material
  language: zh-TW
  features:
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切換為深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切換為淺色

extra:
  version:
    provider: mike
    default: latest

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - zh
        - en

nav:
  - 血液透析中心平板照護輔助系統 — 進度首頁: index.md
  - 每週紀錄:
      - "0909 週報 — Iteration 1＋2 完成、核心流程可完整執行": weekly/2026-09-09.md
  - 進度報告:
      - "血液透析中心平板照護輔助系統 — 開發進度報告": reports/progress-clinical.md
      - "血液透析平板照護輔助系統 — 技術進度報告": reports/progress-technical.md
  - 需求文件:
      - "血液透析中心平板專案：FDE數位化/數位優化評估報告": requirements/fde-assessment.md
      - "血液透析中心平板照護輔助系統 — 軟體需求規格書（SRS）": requirements/srs.md
      - "血液透析平板照護輔助系統 — 資料庫使用規範（測試階段：Supabase）": requirements/database-policy.md
      - "血液透析中心平板照護輔助系統 — 實作規格書（給AI Coding Agent）": requirements/implementation-spec.md
      - "架構圖": requirements/architecture-diagrams.md
  - 參考:
      - "血液透析平板照護輔助系統 — 資料字典": reference/data-dictionary.md
      - "這套系統是用什麼蓋的 — 給非技術背景的人": reference/tech-stack-explained.md
  - 手動測試:
      - "血液透析平板照護輔助系統 — 完整手動測試手冊": testing/manual-test-guide.md
  - 維護流程:
      - "每週紀錄維護流程（人用）": weekly/HOWTO.md
      - "文件維護作業指示（agent 用）": weekly/AGENT.md
